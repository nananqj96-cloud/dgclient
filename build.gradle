buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "aetherclient-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

def nanovgJars = fileTree(dir: 'src/main/resources/META-INF/jars', include: ['*.jar'])
def corzRemappedJar = file('corzport/build/libs/corzport-2.1.0.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Shared pure-Java Corz bridge API + bundled remapped CorzPort mod (Jar-in-Jar)
    implementation project(':corz-api')
    gametestImplementation project(':corz-api')
    gametestRuntimeOnly project(':corz-api')
    testImplementation project(':corz-api')
    include project(':corz-api')
    include project(':corzport')

    // Load remapped CorzPort mod in dev / headless Client GameTests when built
    if (corzRemappedJar.exists()) {
        modRuntimeOnly files(corzRemappedJar)
    }

    implementation nanovgJars
    gametestImplementation nanovgJars
    gametestRuntimeOnly nanovgJars
    testImplementation nanovgJars

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "loader_version": project.loader_version,
            "minecraft_version": project.minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

tasks.named("sourcesJar", Jar) {
    dependsOn(":corz-api:classes")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
    maxHeapSize = "4096M"
    jvmArgs(
        "-Xms1024M",
        "-XX:+UseG1GC",
        "-XX:MaxGCPauseMillis=50",
        "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
    )
    systemProperty("fabric.client.gametest.disableNetworkSynchronizer", "true")
    environment("LP_NUM_THREADS", "1")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
