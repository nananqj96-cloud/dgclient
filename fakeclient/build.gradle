buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'fabric-loom'
}

version = '1.0.0'
group = 'com.fakeclient'

base {
    archivesName = 'fakeclient'
}

repositories {
    mavenCentral()
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'fakeclient-refmap.json'
    }
}

dependencies {
    // Minecraft 1.21.11 compiled against INTERMEDIARY names (net.minecraft.class_XXX),
    // which matches the decompiled source in this project. Loom remaps to Mojang
    // mappings when this subproject is included in the root Aether Client.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':corz-api')
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-nowarn'])
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
