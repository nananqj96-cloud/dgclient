name: Build DGClient

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > gradle-build.log 2>&1
          STATUS=$?
          cat gradle-build.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|FAILED|Caused by:|What went wrong:|> " gradle-build.log | tail -n 20 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=GradleError::$CLEAN"
            done
            exit $STATUS
          fi

      - name: Prepare release jar directory
        run: |
          mkdir -p dist-jar
          for f in build/libs/dgclient-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) ;;
              *) cp -v "$f" dist-jar/ ;;
            esac
          done
          ls -lh dist-jar/

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: dgclient-jar
          path: dist-jar/dgclient-*.jar
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-jar/dgclient-*.jar
          generate_release_notes: true
