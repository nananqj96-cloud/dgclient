name: Build & Verify Aether Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  larp-screenshots:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Xvfb & Mesa OpenGL for real 1.21.11 Client GameTests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Corz Bridge & Subprojects (:corz-api + :corz + :cakeclient + :fakeclient)
        run: |
          set +e
          ./gradlew :corz-api:jar :corz:remapJar :cakeclient:remapJar :fakeclient:remapJar --no-daemon --stacktrace > gradle-corz.log 2>&1
          STATUS=$?
          cat gradle-corz.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|FAILED|Caused by:|What went wrong:" gradle-corz.log | head -n 60 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=CorzBuildError::$CLEAN"
            done
            exit $STATUS
          fi

      - name: Build Aether Client 2.1.0 (Jar-in-Jar)
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > gradle-build.log 2>&1
          STATUS=$?
          cat gradle-build.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|symbol:|location:|FAILED|Caused by:|What went wrong:" gradle-build.log | head -n 120 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=CompileError::$CLEAN"
            done
            exit $STATUS
          fi

      - name: Render Larp Recode GUI screenshots (4 themes + settings expanded)
        run: |
          set +e
          LP_NUM_THREADS=1 xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClientGameTest -Dorg.gradle.jvmargs="-Xmx1024M" --no-daemon --stacktrace > larp-gametest.log 2>&1
          GT_STATUS=$?
          cat larp-gametest.log
          if [ $GT_STATUS -ne 0 ]; then
            python3 - << 'PY'
          from pathlib import Path
          log = Path("larp-gametest.log").read_text(errors="replace")
          noise = ["flite", "alsoft", "pipewire", "realms", "narrator", "unsatisfiedlinkerror",
                   "libflite", "signedjwt", "could not authorize"]
          fail_lines = []
          for l in log.splitlines():
              low = l.lower()
              if "world loading finished:" in low:
                  continue
              if any(n in low for n in noise):
                  continue
              if any(k in low for k in ["failed:", "assertionerror", "test failed", "require", "must ", "got \""]):
                  fail_lines.append(l)
          if fail_lines:
              tail = "\n".join(fail_lines[-60:])
          else:
              lines = [l for l in log.splitlines()
                       if "world loading finished:" not in l.lower()
                       and not any(n in l.lower() for n in noise)]
              tail = "\n".join(lines[-120:])
          esc = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=LarpGameTestLogTail::{esc}")
          PY
            exit $GT_STATUS
          fi

      - name: Upload Larp Recode GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larp-recode-gui-screenshots
          path: build/run/clientGameTest/screenshots/*larp-recode-*.png
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Xvfb & Mesa OpenGL for real 1.21.11 Client GameTests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Corz Bridge & Subprojects (:corz-api + :corz + :cakeclient + :fakeclient)
        run: |
          set +e
          ./gradlew :corz-api:jar :corz:remapJar :cakeclient:remapJar :fakeclient:remapJar --no-daemon --stacktrace > gradle-corz.log 2>&1
          STATUS=$?
          cat gradle-corz.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|FAILED|Caused by:|What went wrong:" gradle-corz.log | head -n 60 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=CorzBuildError::$CLEAN"
            done
            exit $STATUS
          fi
          ls -lh corz/build/libs/

      - name: Build Aether Client 2.1.0 (Jar-in-Jar) & run JUnit 5 suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUTPUT=$(./gradlew build --no-daemon --stacktrace 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            ERRORS=$(echo "$OUTPUT" | grep -E "error:|FAILED|Caused by:|What went wrong:" | head -n 40)
            TAIL=$(echo "$OUTPUT" | tail -n 100)
            {
              echo "## Build Failed"
              echo ""
              echo "Run: ${{ github.run_id }}"
              echo "SHA: ${{ github.sha }}"
              echo ""
              echo "### Error lines:"
              echo '```'
              echo "$ERRORS"
              echo '```'
              echo ""
              echo "### Last 100 lines:"
              echo '```'
              echo "$TAIL"
              echo '```'
            } > /tmp/diag-body.md
            gh issue create --title "CI Build Failure - Run ${{ github.run_id }}" --body-file /tmp/diag-body.md
            exit $STATUS
          fi
          if echo "$OUTPUT" | grep -iE "warning:.*(Unable to locate|Cannot find method|Cannot find target)"; then
            echo "$OUTPUT" | grep -iE "warning:.*(Unable to locate|Cannot find method|Cannot find target)" | head -n 30 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=MixinWarning::$CLEAN"
            done
            exit 1
          fi

      - name: Upload build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Run real Minecraft 1.21.11 Client GameTests (PinkBloom + Synced Corz UI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LP_NUM_THREADS=1 xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClientGameTest -Dorg.gradle.jvmargs="-Xmx1024M" --no-daemon --stacktrace > gametest.log 2>&1
          GT_STATUS=$?
          cat gametest.log
          if [ $GT_STATUS -ne 0 ]; then
            # Crash context: overlay crash, Corz render failures, JVM/native crash, gradle summary
            CRASH=$(grep -aE "AetherClient overlay renderer crashed|Corz Port render failed|Corz Port theme sync failed|AssertionError|FAILED|What went wrong|non-zero exit value|SIGSEGV|SIGABRT|hs_err_pid|OutOfMemoryError|JVM crashed|Fatal" gametest.log \
              | grep -avE "flite|alsoft|pipewire|realms|narrator|unsatisfiedlinkerror|libflite|signedjwt|could not authorize" \
              | tail -n 40)
            # Raw tail of the log (gradle failure summary is always at the very end)
            RAWTAIL=$(tail -n 120 gametest.log)
            # Emit annotations: crash context first, then the raw tail (visible on the job page)
            emit_annotations() {
              local title="$1"; local data="$2"; local max="$3"
              local count=0
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                local CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
                printf '::error title=%s::%s\n' "$title" "$CLEAN"
                count=$((count+1))
                [ "$count" -ge "$max" ] && break
              done <<< "$data"
            }
            if [ -n "$CRASH" ]; then
              emit_annotations "CrashTrace" "$CRASH" 40
            fi
            if [ -n "$RAWTAIL" ]; then
              emit_annotations "GameTestLogTail" "$RAWTAIL" 60
            fi
            # Create a GitHub issue with the failure tail + full log for readability (body capped to avoid 422)
            {
              echo "## GameTest Failure - Run ${{ github.run_id }}"
              echo ""
              echo "SHA: ${{ github.sha }}"
              echo ""
              echo "### Crash context:"
              echo '```'
              echo "$CRASH"
              echo '```'
              echo ""
              echo "### Last 120 log lines:"
              echo '```'
              echo "$RAWTAIL"
              echo '```'
              echo ""
              echo "### Full gametest.log (last 300 lines):"
              echo '```'
              tail -n 300 gametest.log
              echo '```'
            } | head -c 40000 > /tmp/gametest-diag-body.md
            gh issue create --title "CI GameTest Failure - Run ${{ github.run_id }}" --body-file /tmp/gametest-diag-body.md
            exit $GT_STATUS
          fi

      - name: Prepare & verify standalone release JAR (KnotClassLoader isolation check)
        run: |
          mkdir -p dist-jar
          for f in build/libs/aetherclient-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-gametest*) ;;
              *) cp -v "$f" dist-jar/ ;;
            esac
          done
          ls -lh dist-jar/

          python3 - << 'PY'
          import json, os, shutil, subprocess, tempfile, zipfile
          from pathlib import Path

          jars = list(Path("dist-jar").glob("aetherclient-*.jar"))
          assert len(jars) == 1, f"Expected exactly 1 release jar, got {jars}"
          jar_path = jars[0]

          with zipfile.ZipFile(jar_path, "r") as zf:
              names = set(zf.namelist())
              fmj = json.loads(zf.read("fabric.mod.json").decode("utf-8"))
              nested_entries = [entry["file"] for entry in fmj.get("jars", [])]
              print("Nested JAR entries in fabric.mod.json:", nested_entries)

              assert "META-INF/jars/corz-api-2.1.0.jar" in nested_entries, "corz-api-2.1.0.jar missing from fabric.mod.json jars!"
              assert "META-INF/jars/corz-2.1.0.jar" in nested_entries, "corz-2.1.0.jar missing from fabric.mod.json jars!"
              assert "META-INF/jars/cakeclient-6.9.8+1.21.11.jar" in nested_entries, "cakeclient jar missing from fabric.mod.json jars!"
              assert "META-INF/jars/fakeclient-1.0.0.jar" in nested_entries, "fakeclient jar missing from fabric.mod.json jars!"
              assert "META-INF/jars/corz-api-2.1.0.jar" in names, "META-INF/jars/corz-api-2.1.0.jar missing from outer JAR!"
              assert "META-INF/jars/corz-2.1.0.jar" in names, "META-INF/jars/corz-2.1.0.jar missing from outer JAR!"
              assert "META-INF/jars/cakeclient-6.9.8+1.21.11.jar" in names, "META-INF/jars/cakeclient-6.9.8+1.21.11.jar missing from outer JAR!"
              assert "META-INF/jars/fakeclient-1.0.0.jar" in names, "META-INF/jars/fakeclient-1.0.0.jar missing from outer JAR!"

              tmp = Path(tempfile.mkdtemp(prefix="knot-verify-"))
              shutil.copy2(jar_path, tmp / jar_path.name)
              urls = [str(tmp / jar_path.name)]
              for nf in nested_entries:
                  assert nf in names, f"Listed nested jar {nf} missing from archive!"
                  out = tmp / Path(nf).name
                  out.write_bytes(zf.read(nf))
                  urls.append(str(out))

              with zipfile.ZipFile(tmp / "corz-api-2.1.0.jar", "r") as api_zf:
                  api_names = set(api_zf.namelist())
                  for req in [
                      "fabric.mod.json",
                      "dev/aether/corz/CorzProvider.class",
                      "dev/aether/corz/CorzBus.class",
                      "dev/aether/corz/CorzModuleHandle.class",
                      "dev/aether/corz/CorzSettingHandle.class",
                  ]:
                      assert req in api_names, f"Missing {req} in nested corz-api-2.1.0.jar!"

              with zipfile.ZipFile(tmp / "corz-2.1.0.jar", "r") as cp_zf:
                  cp_names = set(cp_zf.namelist())
                  for req in [
                      "fabric.mod.json",
                      "com/corz/client/CorzClient.class",
                      "com/corz/client/bridge/CorzProviderImpl.class",
                  ]:
                      assert req in cp_names, f"Missing {req} in nested corz-2.1.0.jar!"

              verifier = tmp / "VerifyKnot.java"
              verifier.write_text("""
          import java.io.File;
          import java.net.URL;
          import java.net.URLClassLoader;
          public class VerifyKnot {
              public static void main(String[] args) throws Exception {
                  URL[] urls = new URL[args.length];
                  for (int i = 0; i < args.length; i++) {
                      urls[i] = new File(args[i]).toURI().toURL();
                  }
                  try (URLClassLoader knotSim = new URLClassLoader(urls, ClassLoader.getPlatformClassLoader())) {
                      for (String cls : new String[]{
                          "dev.aether.corz.CorzProvider",
                          "dev.aether.corz.CorzBus",
                          "dev.aether.corz.CorzModuleHandle",
                          "dev.aether.corz.CorzSettingHandle",
                          "dev.aether.corz.CorzSettingHandle$Kind"
                      }) {
                          Class<?> loaded = Class.forName(cls, true, knotSim);
                          System.out.println("Verified isolated Knot load: " + loaded.getName());
                      }
                  }
              }
          }
          """)
              subprocess.run(["java", str(verifier), *urls], check=True)
          PY

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherclient-jar
          path: dist-jar/aetherclient-*.jar
          if-no-files-found: error

      - name: Upload in-game verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherclient-gametest-screenshots
          path: |
            build/run/clientGameTest/screenshots/*.png
            gametest.log
          if-no-files-found: ignore

      - name: Publish Direct-Download GitHub Release (v2.2.0)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.2.0"
          NOTES="Aether Client 2.2.0 for Minecraft 1.21.11 Fabric — includes the PinkBloom default theme, Dual-Mode NanoVG ClickGUI, the synced Corz secondary UI with all ported CorzClient gameplay modules, the integrated Cake Client (wings, capes, cosmetics, knives) and Fake Client (Fake Pay, Scoreboard, Item Count, Spawner, Media) as dashboard tabs, a new Credits tab crediting PROSOP for the Cake Client source, and renamed DonutLarp finder modules (Sus Finder, Base Chunk Finder, Activity Inspector)."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-jar/aetherclient-*.jar build/run/clientGameTest/screenshots/*.png --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --title "Aether Client 2.2.0 — Minecraft 1.21.11 Fabric" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist-jar/aetherclient-*.jar build/run/clientGameTest/screenshots/*.png \
              --target "${{ github.sha }}" \
              --title "Aether Client 2.2.0 — Minecraft 1.21.11 Fabric" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi
