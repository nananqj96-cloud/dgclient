name: Build & Verify Aether Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Xvfb & Mesa OpenGL for real 1.21.11 Client GameTests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils libopenal1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CorzPort Bridge & Subproject (:corz-api + :corzport)
        run: |
          set +e
          ./gradlew :corz-api:jar :corzport:remapJar --no-daemon --stacktrace > gradle-corzport.log 2>&1
          STATUS=$?
          cat gradle-corzport.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|FAILED|Caused by:|What went wrong:" gradle-corzport.log | head -n 60 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=CorzPortBuildError::$CLEAN"
            done
            exit $STATUS
          fi
          ls -lh corzport/build/libs/

      - name: Build Aether Client 2.1.0 (Jar-in-Jar) & run JUnit 5 suite
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > gradle-build.log 2>&1
          STATUS=$?
          cat gradle-build.log
          if [ $STATUS -ne 0 ]; then
            grep -E "error:|warning:.*Mixin|FAILED|Caused by:|What went wrong:" gradle-build.log | head -n 60 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=GradleError::$CLEAN"
            done
            exit $STATUS
          fi
          if grep -iE "warning:.*(Unable to locate|Cannot find method|Cannot find target)" gradle-build.log; then
            grep -iE "warning:.*(Unable to locate|Cannot find method|Cannot find target)" gradle-build.log | head -n 30 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=MixinWarning::$CLEAN"
            done
            exit 1
          fi

      - name: Run real Minecraft 1.21.11 Client GameTests (PinkBloom + Synced Corz Port UI)
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClientGameTest --no-daemon --stacktrace > gametest.log 2>&1
          GT_STATUS=$?
          cat gametest.log
          if [ $GT_STATUS -ne 0 ]; then
            grep -E "AssertionError|FAILED|MixinApplyError|MixinTransformerError|Exception|Caused by:" gametest.log | head -n 80 | while IFS= read -r line; do
              CLEAN=$(echo "$line" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=ClientGameTestError::$CLEAN"
            done
            exit $GT_STATUS
          fi

      - name: Prepare release jar & screenshots directory
        run: |
          mkdir -p dist-jar
          for f in build/libs/aetherclient-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-gametest*) ;;
              *) cp -v "$f" dist-jar/ ;;
            esac
          done
          ls -lh dist-jar/
          unzip -l dist-jar/aetherclient-*.jar | grep -E "fabric.mod.json|aetherclient.mixins.json|corzport|CorzPortBus|icon.png"

      - name: Upload compiled JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherclient-jar
          path: dist-jar/aetherclient-*.jar
          if-no-files-found: error

      - name: Upload in-game verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherclient-gametest-screenshots
          path: build/run/clientGameTest/screenshots/*.png
          if-no-files-found: ignore

      - name: Publish Direct-Download GitHub Release (v2.1.0-pinkbloom)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.1.0-pinkbloom"
          NOTES="Aether Client 2.1.0 (PinkBloom Edition) for Minecraft 1.21.11 Fabric — includes the PinkBloom default theme, Dual-Mode NanoVG ClickGUI, and all 139 ported CorzClient gameplay modules (+ native Studio editors) inside the synced Corz Port secondary UI."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-jar/aetherclient-*.jar build/run/clientGameTest/screenshots/*.png --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --title "Aether Client 2.1.0 (PinkBloom + Corz Port) — Minecraft 1.21.11 Fabric" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist-jar/aetherclient-*.jar build/run/clientGameTest/screenshots/*.png \
              --target "${{ github.sha }}" \
              --title "Aether Client 2.1.0 (PinkBloom + Corz Port) — Minecraft 1.21.11 Fabric" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi
