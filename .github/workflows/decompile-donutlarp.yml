name: Decompile DonutLarp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download CFR decompiler
        run: |
          curl -fsSL -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          ls -la cfr.jar
          java -jar cfr.jar --version 2>&1 | head -3 || true

      - name: Decompile donutlarp-1.5.0.jar
        run: |
          java -jar cfr.jar reference/donutlarp-1.5.0.jar --outputdir donutlarp-src --silent true
          echo "=== Decompiled files ==="
          find donutlarp-src -type f | sort

      - name: Commit decompiled source to scratch folder
        run: |
          git config user.name "decompile-bot"
          git config user.email "decompile-bot@users.noreply.github.com"
          git add donutlarp-src
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: decompiled DonutLarp 1.5.0 source (scratch, for porting)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload decompiled source artifact
        uses: actions/upload-artifact@v4
        with:
          name: donutlarp-decompiled-source
          path: donutlarp-src/
