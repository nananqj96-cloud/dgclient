plugins {
    id 'java'
}

version = '1.0.2'
group = 'dev.purxiy'

base {
    archivesName = 'purxiyvisuals'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Purxiy is a pre-compiled jar. We package the patched extracted directory
// directly as the jar output (no compilation needed).
// The java plugin creates the 'jar' task; we override its source to use patched/.
tasks.named('jar', Jar) {
    archiveBaseName.set('purxiyvisuals')
    archiveClassifier.set('')
    archiveVersion.set('1.0.2')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('patched') {
        include '**/*'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('jar')
}
