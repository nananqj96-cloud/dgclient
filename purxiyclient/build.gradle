plugins {
    id 'java'
}

version = '1.0.2'
group = 'dev.purxiy'

base {
    archivesName = 'purxiyvisuals'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Purxiy is a pre-compiled jar. We package the patched extracted directory
// directly as a jar (no compilation needed).
tasks.register('patchedJar', Jar) {
    archiveBaseName.set('purxiyvisuals')
    archiveClassifier.set('')
    archiveVersion.set('1.0.2')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('patched') {
        include '**/*'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('patchedJar')
}

tasks.register('remapJar', Copy) {
    from tasks.named('patchedJar')
    into layout.buildDirectory.dir('remapped')
    rename { 'purxiyvisuals-1.0.2.jar' }
}

// The main jar task just packages the patched content
tasks.register('jar', Jar) {
    archiveBaseName.set('purxiyvisuals')
    archiveClassifier.set('')
    archiveVersion.set('1.0.2')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('patched') {
        include '**/*'
    }
}
